apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-0
  labels:
    app: nginx-deployment-0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-deployment-0
  template:
    metadata:
      labels:
        app: nginx-deployment-0
    spec:
      priorityClassName: high-priority
      containers:
        - name: nginx-deployment-0
          image: nginx:1.27.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m # TODO: Set this to the maximum amount of CPU you want your workload to use
              memory: 128Mi
            requests:
              cpu: 100m # TODO: Set this to the amount of CPU you want to reserve for your workload
              memory: 64Mi
---
